name: Build release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath RELEASE_VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid RELEASE_VERSION' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          $existing = gh release view "v$version" --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing -eq 'false') {
            throw 'This version is already published; increase RELEASE_VERSION.'
          }
          exit 0

      - name: Security regression tests and source audit
        shell: pwsh
        run: |
          dotnet run --project tests/SecurityTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Security tests failed' }
          ./Audit-Source.ps1
          dotnet list KpcLauncher.csproj package --vulnerable --include-transitive --format json > advisories.json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed' }
          $audit = Get-Content advisories.json -Raw | ConvertFrom-Json
          if ($audit.problems) { throw 'Dependency advisory service reported a problem' }
          foreach ($project in $audit.projects) {
            foreach ($framework in $project.frameworks) {
              if ($framework.topLevelPackages -or $framework.transitivePackages) {
                throw 'Known vulnerable dependency found'
              }
            }
          }

      - name: Build installer and update packages
        shell: pwsh
        run: ./publish.ps1 -Version $env:RELEASE_VERSION

      - name: Verify assets and generate checksums
        shell: pwsh
        run: |
          $directory = (Resolve-Path artifacts/releases).Path
          foreach ($name in @('KPCLauncher-win-Setup.exe', "KPCLauncher-$env:RELEASE_VERSION-full.nupkg", 'releases.win.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $directory $name) -PathType Leaf)) {
              throw "Required release asset missing: $name"
            }
          }
          Get-ChildItem -LiteralPath $directory -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -LiteralPath (Join-Path $directory 'SHA256SUMS.txt') -Encoding ascii

      - name: Attest build provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/releases/KPCLauncher-win-Setup.exe
            artifacts/releases/*.nupkg

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $assets = @(
            'artifacts/releases/KPCLauncher-win-Setup.exe'
            "artifacts/releases/KPCLauncher-$version-full.nupkg"
            'artifacts/releases/releases.win.json'
            'artifacts/releases/SHA256SUMS.txt'
          )
          $provenance = if ($env:PRIVATE_REPOSITORY -eq 'false') {
            "Includes GitHub build provenance. Verify with: gh attestation verify KPCLauncher-win-Setup.exe --repo $env:GITHUB_REPOSITORY"
          } else { 'Private draft build: no public provenance attestation was generated.' }
          $notes = @"
          Steam now authorizes your account in the browser on first launch. Steam itself downloads
          the files; the launcher checks that its connected account matches your authorization.

          - Removed the previous QR, credential and direct CDN download implementations.
          - Rejects mismatched accounts and invalid browser callbacks.
          - Checks archive content with SHA-256 receipts and preserves replaced folders.
          - Download preservation only; no game files are included.

          Download KPCLauncher-win-Setup.exe. Windows installer is currently unsigned.
          SHA256SUMS.txt contains checksums for all generated release assets.

          Built from $env:GITHUB_SHA by https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          $provenance
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
          $existing = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne 'true') { throw 'Refusing to replace a published release' }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed' }
            gh release edit $tag --notes-file $notesFile --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Draft update failed' }
          } else {
            gh release create $tag @assets --draft --target $env:GITHUB_SHA --title "KPC Launcher $version" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          if ($env:PRIVATE_REPOSITORY -eq 'false') {
            gh release edit $tag --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }
